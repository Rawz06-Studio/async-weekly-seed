name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    uses: RawZ06-Studio/.github/.github/workflows/node-ci-release.yml@main
    permissions:
      contents: write
    with:
      publishable: false       # application, pas de publish npm
    secrets: inherit

  sonar:
    needs: release
    uses: RawZ06-Studio/.github/.github/workflows/node-ci-sonar.yml@main
    with:
      node_version: '24'
    secrets: inherit

  docker-api:
    needs: release
    uses: RawZ06-Studio/.github/.github/workflows/docker-build-push.yml@main
    with:
      image_name: async-weekly-seed-api
      dockerfile: api/Dockerfile
      dokploy_app_id: 0AERb2Ga212nnBVmepO7I
    secrets: inherit

  docker-web:
    needs: release
    uses: RawZ06-Studio/.github/.github/workflows/docker-build-push.yml@main
    with:
      image_name: async-weekly-seed-web
      dockerfile: web/Dockerfile
      dokploy_app_id: REPLACE_WITH_WEB_APP_ID
    secrets: inherit
